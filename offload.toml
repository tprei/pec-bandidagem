version = 1

[worker]
memory_mb = 4096
max = 1

[setup]
inputs = ["package.json", "package-lock.json"]
run = ["npm ci"]

[sync]
exclude = ["fotos-tse/**", "fotos/**", "data/dex/votos/**", "data/dex/pesquisa/**"]

[tasks.check]
run = "npm run lint && npm run format:check && npm test && npm run check:refs && npm run check:copy"
timeout = "15m"

[tasks.test]
run = "npm test"
timeout = "15m"
